<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dia de los Muertos: Escape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-container">
        <div id="menu">
            <h1>Escape the Afterlife</h1>
            <p>Kies je avatar:</p>
            <div class="avatar-grid">
                <button onclick="startGame('ghost')">👻 Spook</button>
                <button onclick="startGame('skeleton')">💀 Skelet</button>
                <button onclick="startGame('coco')">👵 Mama Coco</button>
                <button onclick="startGame('devil')">😈 Duivel</button>
            </div>
        </div>

        <div id="hud" style="display:none;">
            <div id="timer">Tijd over: 05:00</div>
            <div id="world-name">Wereld: Het Dorp</div>
            <div id="instruction">Zoek de gouden sleutel!</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
